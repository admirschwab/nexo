[package]
name = "nexo-cli"
version = "0.1.0"
edition = "2024"

# Das Programm heißt `nexo` (nicht nexo-cli)
[[bin]]
name = "nexo"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# TLS für wss:// (Server hinter https). Prüft Zertifikate gegen den Zertifikatsspeicher des Systems.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
crossterm = { version = "0.29", features = ["event-stream"] }
serde_json = "1.0.151"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
chrono = "0.4.45"
zeroize = "1.9.0"
dirs = "7.0.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

# Argon2 mit 64 MiB ist ohne Optimierung sehr langsam, auch im Debug-Build optimieren
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
