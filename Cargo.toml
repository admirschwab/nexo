[package]
name = "nexo-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
crossterm = { version = "0.29", features = ["event-stream"] }
serde_json = "1.0.151"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
chrono = "0.4.45"
